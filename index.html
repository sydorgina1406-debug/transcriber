<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ЭОТ-Ассистент · Стиль Юлии</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --plum: #8B3252;
  --forest: #2D4A3E;
  --terra: #C4714A;
  --warm-white: #F5F0EB;
  --bg: #FFFFFF;
  --dark: #3A2030;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost', sans-serif;background:var(--warm-white);color:var(--dark);min-height:100vh}
h1, h2, h3 {font-family:'Cormorant Garamond', serif; color:var(--plum)}
#root{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--forest);color:var(--warm-white);padding:2rem 1rem;position:fixed;height:100vh}
.page{margin-left:220px;flex:1;padding:2rem}
.nav-logo{font-family:'Cormorant Garamond', serif;font-size:24px;margin-bottom:2rem;color:var(--warm-white)}
.nav-btn{padding:12px;color:#d1d5db;background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:'Jost',sans-serif}
.nav-btn:hover{color:#fff}
.panel{border:1px solid #e5e7eb;border-radius:16px;background:var(--bg);padding:1.5rem;margin-top:1rem;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05)}
.btn{padding:12px 24px;border-radius:8px;cursor:pointer;border:none;font-weight:500;margin-right:10px;font-family:'Jost',sans-serif}
.btn-dark{background:var(--dark);color:var(--warm-white)}
.btn-success{background:var(--forest);color:var(--warm-white)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

function App(){
  const[tr,setTr]=useState([]);
  const[notes,setNotes]=useState([]);
  const[isRec,setIsRec]=useState(false);

  function startRec(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR(); r.continuous = true; r.interimResults = true; r.lang = "ru-RU";
    r.onresult = e => { const last = e.results[e.results.length-1]; if(last.isFinal) setTr(p=>[...p, {text: last[0].transcript}]); };
    r.start(); setIsRec(true);
  }

  return(<div>
    <div className="sidebar">
      <div className="nav-logo">ЭОТ-Ассистент</div>
      <button className="nav-btn" onClick={()=>window.location.reload()}>Главная</button>
    </div>
    <div className="page">
      <h2>Сессия: Исследование обиды</h2>
      <div style={{marginTop:20}}>
        <button className={"btn "+(isRec?"btn-dark":"btn-success")} onClick={isRec?()=>window.location.reload():startRec}>
          {isRec?"Остановить запись":"Начать запись"}
        </button>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"20px"}}>
        <div className="panel"><h3>Транскрипт</h3>{tr.map((t,i)=><p key={i} style={{marginBottom:8}}>{t.text}</p>)}</div>
        <div className="panel"><h3>Анализ ИИ</h3>{notes.map((n,i)=><div key={i}>{n.text}</div>)}</div>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
