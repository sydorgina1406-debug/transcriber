body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f7f4;min-height:100vh}

.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:#8fa3bc;background:none;border:none;font-size:13px;width:100%;text-align:left;font-family:inherit;transition:all .15s}

.cr{background:#fee2e2;color:#991b1b}

.stag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:#ede9fe;color:#5b21b6;margin-right:4px;margin-bottom:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem;flex-wrap:wrap;gap:8px}

<script type="text/babel">
const {useState, useEffect, useRef} = React;

const FILLER=/\b(ну+|вот+|эм+|э+м*|м+|аа+|эй|ой|ах|ох|блин|короче|типа|как бы|значит|понимаешь|слушай|в общем|ладно|собственно)\b[,.]?\s*/gi;
const clean=t=>t.replace(FILLER,"").replace(/\s{2,}/g," ").trim();
const fmt=d=>new Date(d).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
const fmtD=d=>new Date(d).toLocaleDateString("ru",{day:"numeric",month:"long",year:"numeric"});
const COLL="transcriber_sessions";

async function fbLoad(){try{if(!db)return[];const s=await db.collection(COLL).orderBy("date","desc").limit(50).get();return s.docs.map(d=>({id:d.id,...d.data()}));}catch{return[];}}
async function fbSave(s){try{if(db)await db.collection(COLL).doc(s.id).set(s);}catch{}}
async function fbDel(id){try{if(db)await db.collection(COLL).doc(id).delete();}catch{}}
async function fbSaveSett(d){try{if(db)await db.collection("transcriber_settings").doc("main").set(d);}catch{}}
async function fbLoadSett(){try{if(!db)return null;const d=await db.collection("transcriber_settings").doc("main").get();return d.exists?d.data():null;}catch{return null;}}

const ESYS=`Ты — супервизор-ассистент психолога Юлии, специалиста по ЭОТ, МАК и расстановкам.
12-ШАГОВАЯ СТРУКТУРА ЭОТ:
1.Клиническая беседа 2.Прояснение симптома 3.Создание образа 4.Стать образом+исследование(ПРЕДПИСАНИЯ) 5.Любовь и поддержка 6.Методы возврата 7.Методы разрешения 8.Новые убеждения 9.Соматизация 10.Ситуативная проверка 11.Экологическая проверка 12.Закрепление
ОБРАЗ РЕБЁНКА:фиксация,убеждения,стратегия,потребность. ОБРАЗ РОДИТЕЛЯ:ЗДЕСЬ ПРЕДПИСАНИЯ через почему/зачем.
Формат ответа:
📍 ЭТАП:(номер и название)
🔍 СЕЙЧАС:(1-2 предложения)
💡 ПРЕДПИСАНИЯ/УБЕЖДЕНИЯ:(словами клиента)
🔁 ПАТТЕРНЫ:(повторяющееся)
💔 ФИКСАЦИЯ:(состояние ребёнка)
💎 РЕСУРСЫ:(опоры)
❓ НЕ ЗАКРЫТО:(важные темы)
🌡️ ТЕЛО:(маркеры)
➡️ ПОДСКАЗКА:(следующий шаг)
Пиши кратко и конкретно.`;

const MSYS=`Методист по МАК. Составь авторскую технику из 5-6 карт для психолога Юлии.
Структура:1-2 диагностика→2-3 исследование→1-2 трансформация. К каждой позиции 1-2 открытых вопроса(без почему). Название метафоричное. Стиль как у "Анатомия обиды".
Верни ТОЛЬКО JSON без markdown:{"title":"...","request":"...","positions":[{"num":1,"title":"...","instruction":"...","questions":["...","..."]}]}`;

async function ai(sys,user,sett){
  const p=sett.provider||"gemini";
  
  if(p==="gigachat" && sett.gigaKey){
    try {
      const r = await fetch("https://gigachat.devices.sberbank.ru/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${sett.gigaKey}`
        },
        body: JSON.stringify({
          model: "GigaChat",
          messages: [
            { role: "system", content: sys },
            { role: "user", content: user }
          ],
          temperature: 0.7
        })
      });
      const d = await r.json();
      if(d.error) throw new Error(d.error.message);
      return d.choices?.[0]?.message?.content || "";
    } catch (err) {
      return "⚠️ Ошибка подключения к GigaChat: убедитесь, что ваш токен активен и выдан для работы с API.";
    }
  }
  
  if(p==="gemini"&&sett.geminiKey){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+sett.geminiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:sys+"\n\n"+user}]}]})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);return d.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }
  if(p==="claude"&&sett.claudeKey){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":sett.claudeKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:[{role:"user",content:user}]})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);return d.content?.[0]?.text||"";
  }
  if(p==="openai"&&sett.openaiKey){
    const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+sett.openaiKey},body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"system",content:sys},{role:"user",content:user}]})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);return d.choices?.[0]?.message?.content||"";
  }
  return"⚠️ Нужен API-ключ выбранного провайдера. Откройте Настройки.";
}

function Sidebar({view,setView,isRec,onSett}){
  const items=[{id:"home",ic:"ti-layout-dashboard",lb:"Главная"},{id:"live",ic:"ti-microphone",lb:"Живая сессия"},{id:"file",ic:"ti-file-upload",lb:"Обработка аудиофайла"}];
  return(<div className="sidebar">
    <div className="nav-logo"><div className="nav-logo-title">🧠 ЭОТ-Ассистент</div><div className="nav-logo-sub">транскрибатор · Юлия</div></div>
    {items.map(it=>(<button key={it.id} className={"nav-btn"+(view===it.id?" active":"")} onClick={()=>setView(it.id)}><i className={"ti "+it.ic}></i>{it.lb}{it.id==="live"&&isRec&&<span className="rec-dot" style={{marginLeft:"auto"}}></span>}</button>))}
    <div className="nav-footer"><button className="nav-btn" onClick={onSett}><i className="ti ti-settings"></i>Настройки</button></div>
  </div>);
}

function MakCard({data}){
  return(<div className="mak-card">
    <div className="mak-title"><i className="ti ti-cards"></i>«{data.title}»</div>
    {data.request&&<p style={{fontSize:12,color:"#7e22ce",marginBottom:".75rem",padding:"6px 10px",background:"#f5f3ff",borderRadius:6}}>Запрос: {data.request}</p>}
    {(data.positions||[]).map((p,i)=>(<div key={i} className="mak-pos">
      <div className="mak-num">{p.num}</div>
      <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:"#6b21a8",marginBottom:2}}>{p.title}</div><div style={{fontSize:12,color:"#7e22ce",lineHeight:1.5}}>{p.instruction}</div>{(p.questions||[]).map((q,j)=>(<div key={j} style={{fontSize:11,color:"#9333ea",marginTop:3,fontStyle:"italic"}}>— {q}</div>))}</div>
    </div>))}
  </div>);
}

function NotesPanel({notes,mak,lN,lM,tr,onN,onM}){
  const[tab,setTab]=useState("notes");
  const endRef=useRef(null);
  useEffect(()=>{if(tab==="notes"&&endRef.current)endRef.current.scrollIntoView({behavior:"smooth"});},[notes,tab]);
  useEffect(()=>{if(mak)setTab("mak");},[mak]);
  return(<div className="panel">
    <div className="panel-hdr">
      <div style={{display:"flex"}}>
        <button style={{padding:"2px 10px",fontSize:12,border:"none",background:"none",cursor:"pointer",fontFamily:"inherit",borderBottom:tab==="notes"?"2px solid #3b82f6":"2px solid transparent",color:tab==="notes"?"#1d4ed8":"#6b7280",fontWeight:tab==="notes"?500:400}} onClick={()=>setTab("notes")}>ЭОТ-анализ</button>
        <button style={{padding:"2px 10px",fontSize:12,border:"none",background:"none",cursor:"pointer",fontFamily:"inherit",borderBottom:tab==="mak"?"2px solid #7c3aed":"2px solid transparent",color:tab==="mak"?"#5b21b6":"#6b7280",fontWeight:tab==="mak"?500:400}} onClick={()=>setTab("mak")}>МАК{mak&&<span className="chip cp" style={{marginLeft:5,fontSize:10}}>✓</span>}</button>
      </div>
      <span style={{fontSize:11,color:"#94a3b8"}}>{notes.length}</span>
    </div>
    <div className="panel-body">
      {tab==="notes"&&<div>
        {notes.length===0&&!lN&&<div className="empty"><i className="ti ti-notes"></i><p style={{fontSize:12}}>Заметки по 12 шагам ЭОТ появятся здесь</p></div>}
        {lN&&<div style={{textAlign:"center",padding:16,color:"#64748b",fontSize:12}}><span className="spin"></span>Анализирую по ЭОТ...</div>}
        {notes.map((n,i)=>(<div key={i} className="note-card"><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:11,color:"#94a3b8",fontWeight:500}}>{n.time}</span><span className={"chip "+(n.auto?"cb":"cg")}>{n.auto?"авто":"запрос"}</span></div><pre style={{whiteSpace:"pre-wrap",fontFamily:"inherit",fontSize:12,lineHeight:1.75,color:"#1e293b"}}>{n.content}</pre></div>))}
        <div ref={endRef}></div>
      </div>}
      {tab==="mak"&&<div>
        {!mak&&!lM&&<div className="empty"><i className="ti ti-cards"></i><p style={{fontSize:12,marginBottom:12}}>Когда запрос прояснён — составьте МАК-технику</p><button className="btn btn-mak" style={{fontSize:12}} onClick={onM} disabled={tr.length===0}><i className="ti ti-sparkles"></i>Составить технику</button></div>}
        {lM&&<div style={{textAlign:"center",padding:16,color:"#7e22ce",fontSize:12}}><span className="spinp"></span>Составляю технику...</div>}
        {mak&&<div><MakCard data={mak}/><button className="btn btn-mak" style={{fontSize:12,width:"100%"}} onClick={onM} disabled={lM}>Пересоставить</button></div>}
      </div>}
    </div>
  </div>);
}

function LiveView({isRec,tr,notes,mak,interim,spk,setSpk,lN,lM,name,setName,auto,setAuto,onStart,onStop,onN,onM,onEnd,trEnd,sett}){
  const[showEnd,setShowEnd]=useState(false);
  const lastN=notes[notes.length-1];
  const sm=lastN?.content?.match(/📍 ЭТАП[:\s]+([^\n]+)/);
  const stage=sm?sm[1].trim():null;
  return(<div>
    <div className="topbar">
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {isRec&&<span className="rec-dot"></span>}
        <input className="sname" value={name} onChange={e=>setName(e.target.value)} placeholder="Название сессии..."/>
        {stage&&<span className="sbadge">{stage}</span>}
      </div>
      <div className="ctrls">
        {isRec?(<div style={{display:"flex",gap:6}}>
          <div className="spk-tog"><button className={"spk-btn"+(spk==="Клиент"?" cl":"")} onClick={()=>setSpk("Клиент")}>Клиент</button><button className={"spk-btn"+(spk==="Психолог"?" ps":"")} onClick={()=>setSpk("Психолог")}>Психолог</button></div>
          <button className="btn btn-outline" onClick={onN} disabled={lN||tr.length===0} style={{fontSize:12}}>{lN?<span className="spin"></span>:<><i className="ti ti-brain"></i>ЭОТ</>}</button>
          <button className="btn btn-mak" onClick={onM} disabled={lM||tr.length===0} style={{fontSize:12}}>{lM?<span className="spinp"></span>:<><i className="ti ti-cards"></i>МАК</>}</button>
          <button className="btn btn-danger" onClick={onStop} style={{fontSize:12}}><i className="ti ti-player-stop"></i>Стоп</button>
        </div>):(<div>
          <button className="btn btn-success" onClick={onStart}><i className="ti ti-player-play"></i>Начать запись</button>
          {tr.length>0&&!showEnd&&<button className="btn btn-dark" style={{fontSize:12}} onClick={()=>setShowEnd(true)}>Завершить</button>}
          {showEnd&&<div style={{display:"flex",gap:4,alignItems:"center"}}><span style={{fontSize:12,color:"#64748b"}}>Сохранить?</span><button className="btn btn-dark" style={{fontSize:12}} onClick={onEnd}>Да</button><button className="btn btn-outline" style={{fontSize:12}} onClick={()=>setShowEnd(false)}>Нет</button></div>}
        </div>)}
      </div>
    </div>
    <div style={{marginBottom:10,fontSize:12,color:"#94a3b8"}}>
      <label style={{display:"inline-flex",alignItems:"center",gap:5,cursor:"pointer"}}><input type="checkbox" checked={auto} onChange={e=>setAuto(e.target.checked)}/>Авто-анализ каждые 60 сек</label>
      <span style={{margin:"0 8px"}}>·</span><span>Только Chrome</span>
    </div>
    <div className="two-col">
      <div className="panel">
        <div className="panel-hdr"><span style={{fontWeight:600,fontSize:13}}><i className="ti ti-align-left"></i> Транскрипт</span><span style={{fontSize:11,color:"#94a3b8"}}>{tr.length} реплик</span></div>
        <div className="panel-body">
          {tr.length===0&&!interim&&<div className="empty"><i className="ti ti-microphone-off"></i><p style={{fontSize:12}}>Нажмите «Начать запись»</p></div>}
          {tr.map((t,i)=>(<div key={i} className={"ti-item "+(t.speaker==="Клиент"?"client":"psychologist")}>

          </div>))}
          {interim&&<div className="ti-item interim"><div style={{fontSize:10,color:"#cbd5e1",marginBottom:2}}>{spk} · сейчас</div><div style={{fontSize:13,color:"#94a3b8",fontStyle:"italic"}}>{interim}...</div></div>}
          <div ref={trEnd}></div>
        </div>
      </div>
      <NotesPanel notes={notes} mak={mak} lN={lN} lM={lM} tr={tr} onN={onN} onM={onM}/>
    </div>
  </div>);
}

function FileView({onTextReady}){
  const[loading,setLoading]=useState(false);
  const[status,setStatus]=useState("");
  const[resultText,setResultText]=useState("");
  const audioCtxRef = useRef(null);

  function processAudioFile(file){
    if(!file) return;
    setLoading(true);
    setResultText("");
    setStatus("Чтение файла и подготовка декодера голоса...");

    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Пожалуйста, откройте это приложение в браузере Google Chrome.");
          setLoading(false);
          return;
        }

        const audioData = e.target.result;
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtxRef.current.decodeAudioData(audioData);
        
        setStatus("Файл успешно декодирован. Идет бесплатное извлечение текста...");

        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = "ru-RU";

        let finalTranscript = "";

        recognition.onresult = (event) => {
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript + " ";
              setResultText(finalTranscript.trim());
            }
          }
        };

        recognition.onend = () => {
          setStatus("Готово! Текст успешно извлечен без затрат баланса.");
          setLoading(false);
          if (finalTranscript.trim()) {
            onTextReady(finalTranscript.trim(), file.name);
          }
        };

        recognition.onerror = (err) => {
          console.error("Recognition error:", err);
        };

        const source = audioCtxRef.current.createBufferSource();
        source.buffer = audioBuffer;
        
        const destination = audioCtxRef.current.createMediaStreamDestination();
        source.connect(destination);
        
        const gainNode = audioCtxRef.current.createGain();
        gainNode.gain.value = 0.01; 
        source.connect(gainNode);
        gainNode.connect(audioCtxRef.current.destination);

        recognition.start();
        source.start(0);
        
        source.onended = () => {
          setTimeout(() => {
            recognition.stop();
          }, 1000);
        };

      } catch (err) {
        alert("Не удалось обработать аудиофайл: " + err.message);
        setLoading(false);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  return(<div>
    <h2>Обработка аудиофайла</h2>
    <p className="sub">Полностью бесплатное локальное распознавание силами Google Chrome (без использования ключей OpenAI)</p>
    <div className="card">
      <p style={{fontWeight:600,fontSize:13,marginBottom:6}}><i className="ti ti-file-audio" style={{marginRight:5}}></i>Выберите аудиозапись сессии</p>
      <p style={{fontSize:12,color:"#94a3b8",marginBottom:12}}>Поддерживаются любые размеры файлов (включая записи более 25 МБ)</p>
      <input type="file" accept="audio/*,video/*" onChange={e=>processAudioFile(e.target.files[0])} style={{fontSize:13}} disabled={loading}/>
    </div>
    
    {loading&&<div style={{padding:"1.5rem",background:"#fff",borderRadius:12,border:"0.5px solid #e5e7eb",textAlign:"center",color:"#475569",fontSize:13}}>
      <span className="spin"></span> {status}
    </div>}

    {resultText&&<div style={{marginTop:"1rem"}}>
      <p style={{fontWeight:600,fontSize:13,marginBottom:6}}>Промежуточный текст расшифровки:</p>
      <div style={{background:"#f8fafc",borderRadius:10,padding:"0.875rem",fontSize:13,lineHeight:1.8,maxHeight:250,overflowY:"auto",color:"#475569"}}>{resultText}</div>
    </div>}
  </div>);
}

    <h2 style={{marginBottom:4}}>{session.name}</h2>
    <p className="sub">{fmtD(session.date)} · {session.transcript?.length||0} реплик</p>
    <div className="tabs">
      {["transcript","notes","mak"].map(t=>(<button key={t} className={"tab"+(tab===t?" on":"")} onClick={()=>setTab(t)}>{t==="transcript"?"Транскрипт":t==="notes"?"ЭОТ-заметки":"МАК-техника"}</button>))}
      <button className="btn btn-outline" style={{marginLeft:"auto",fontSize:11,padding:"4px 10px"}} onClick={()=>navigator.clipboard.writeText(full)}><i className="ti ti-copy"></i>Копировать</button>
    </div>
    {tab==="transcript"&&(session.transcript||[]).map((t,i)=>(<div key={i} className={"ti-item "+(t.speaker==="Клиент"?"client":"psychologist")}>
      <div style={{fontSize:10,color:"#94a3b8",marginBottom:2,fontWeight:600}}>{t.speaker} · {t.time}</div>
      <div style={{fontSize:13,lineHeight:1.65}}>{t.text}</div>
    </div>))}
    {tab==="notes"&&<div>
      {!(session.notes||[]).length&&<div className="empty"><p style={{fontSize:13}}>Заметки не сохранены</p></div>}
      {(session.notes||[]).map((n,i)=>(<div key={i} className="note-card"><div style={{fontSize:11,color:"#94a3b8",marginBottom:6,fontWeight:500}}>{n.time}</div><pre style={{whiteSpace:"pre-wrap",fontFamily:"inherit",fontSize:12,lineHeight:1.75,color:"#1e293b"}}>{n.content}</pre></div>))}
    </div>}
    {tab==="mak"&&(session.mak?<MakCard data={session.mak}/>:<div className="empty"><i className="ti ti-cards"></i><p style={{fontSize:13}}>МАК-техника не составлялась</p></div>)}

  const[loc,setLoc]=useState({...sett});
  const kf={openai:"openaiKey",gemini:"geminiKey",claude:"claudeKey",gigachat:"gigaKey"};
  const cur=kf[loc.provider];
  return(<div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem"}}><h2 style={{fontSize:17}}>Настройки ИИ-анализа</h2><button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:"#94a3b8"}}>×</button></div>
      <label className="fl">AI-провайдер для разбора сессий</label>
      {[{id:"gemini",nm:"Gemini (Google AI)",badge:"активен",c:"cb"},{id:"gigachat",nm:"GigaChat (Сбер)",badge:"доступен",c:"cg"},{id:"claude",nm:"Claude (Anthropic)",badge:"опционально",c:"cg"},{id:"openai",nm:"OpenAI GPT-4o",badge:"опционально",c:"cb"}].map(p=>(<label key={p.id} className={"ri"+(loc.provider===p.id?" sel":"")}>
        <input type="radio" name="prov" value={p.id} checked={loc.provider===p.id} onChange={()=>setLoc({...loc,provider:p.id})}/>
        <span style={{flex:1,fontSize:13}}>{p.nm}</span>
        <span className={"chip "+p.c}>{p.badge}</span>
      </label>))}
      {cur&&<div style={{marginTop:"0.875rem"}}>
        <label className="fl">{loc.provider==="gigachat" ? "Авторизационные данные (Ключ API)" : "Ваш API Ключ"}</label>
        <input className="fi" type="password" placeholder="Вставьте ключ..." value={loc[cur]||""} onChange={e=>setLoc({...loc,[cur]:e.target.value})}/>
      </div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:12}}>
        <button className="btn btn-outline" onClick={onClose}>Отмена</button>
        <button className="btn btn-dark" onClick={()=>{onSave(loc);onClose();}}>Сохранить</button>
      </div>
    </div>
  </div>);
}

function App(){
  const[view,setView]=useState("home");
  const[sessions,setSessions]=useState([]);
  const[sett,setSett]=useState({provider:"gemini",claudeKey:"",openaiKey:"",geminiKey:"",gigaKey:"",lang:"ru-RU"});
  const[showSett,setShowSett]=useState(false);
  const[sel,setSel]=useState(null);
  const[isRec,setIsRec]=useState(false);
  const[tr,setTr]=useState([]);
  const[notes,setNotes]=useState([]);
  const[mak,setMak]=useState(null);
  const[spk,setSpk]=useState("Клиент");
  const[auto,setAuto]=useState(true);
  const[lN,setLN]=useState(false);
  const[lM,setLM]=useState(false);
  const[name,setName]=useState("");
  const[interim,setInterim]=useState("");
  const[fbLoading,setFbLoading]=useState(true);
  
  const recRef=useRef(null);
  const trEnd=useRef(null);
  const trRef=useRef(tr);trRef.current=tr;
  const isRecRef=useRef(isRec);isRecRef.current=isRec;
  const spkRef=useRef(spk);spkRef.current=spk;
  const atRef=useRef(null);
  const lNRef=useRef(lN);lNRef.current=lN;
  const settRef=useRef(sett);settRef.current=sett;

  useEffect(()=>{
    fbLoad().then(d=>{setSessions(d);setFbLoading(false);});
    fbLoadSett().then(d=>{if(d)setSett(s=>({...s,...d}));});
  },[]);

  useEffect(()=>{if(trEnd.current)trEnd.current.scrollIntoView({behavior:"smooth"});},[tr,interim]);

  async function doN(a=false){
    if(trRef.current.length===0||lNRef.current)return;
    setLN(true);
    try{const t=await ai(ESYS,"Транскрипт:\n\n"+trRef.current.map(t=>t.speaker+": "+t.text).join("\n")+"\n\nДай заметки.",settRef.current);setNotes(prev=>[...prev,{time:fmt(new Date()),content:t,auto:a}]);}catch(e){console.error(e);}
    setLN(false);
  }

  async function doM(){
    if(trRef.current.length===0)return;
    setLM(true);
    try{const raw=await ai(MSYS,"Транскрипт:\n\n"+trRef.current.map(t=>t.speaker+": "+t.text).join("\n")+"\n\nСоставь МАК-технику.",settRef.current);const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());setMak(parsed);}
    catch(e){setMak({title:"Ошибка",request:"",positions:[{num:1,title:"Ошибка",instruction:String(e),questions:[]}]});}
    setLM(false);
  }

  function startRec(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Требуется Chrome.");return;}
    const r=new SR();r.continuous=true;r.interimResults=true;r.lang="ru-RU";
    r.onresult=e=>{
      let itr="";
      for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal){const t=clean(res[0].transcript.trim());if(t){const s=spkRef.current;setTr(prev=>{if(prev.length>0&&prev[prev.length-1].speaker===s){const u=[...prev];u[u.length-1]={...u[u.length-1],text:u[u.length-1].text+" "+t};return u;}return[...prev,{speaker:s,text:t,time:fmt(new Date())}];});setInterim("");}}else itr+=res[0].transcript;}
      setInterim(itr);
    };
    r.onerror=e=>{if(e.error!=="no-speech")console.error(e.error);};
    r.onend=()=>{if(isRecRef.current)try{r.start();}catch{}};
    r.start();recRef.current=r;setIsRec(true);
    if(auto)atRef.current=setInterval(()=>{if(trRef.current.length>2)doN(true);},60000);
  }

  function stopRec(){recRef.current?.stop();recRef.current=null;setIsRec(false);setInterim("");if(atRef.current)clearInterval(atRef.current);}

  async function endSess(){
    stopRec();if(tr.length===0){setView("home");return;}
    let fn=notes;
    if(notes.length===0){setLN(true);try{const t=await ai(ESYS,"Транскрипт:\n\n"+tr.map(t=>t.speaker+": "+t.text).join("\n"),settRef.current);fn=[{time:fmt(new Date()),content:t,auto:true}];setNotes(fn);}catch{}setLN(false);}
    const s={id:Date.now().toString(),name:name||"Сессия "+new Date().toLocaleDateString("ru"),date:new Date().toISOString(),transcript:tr,notes:fn,mak};
    setSessions(prev=>[s,...prev]);await fbSave(s);
    setTr([]);setNotes([]);setMak(null);setName("");setView("home");
  }

  function handleFileTextReady(extractedText, fileName){
    const chunks = extractedText.match(/[^.!?]+[.!?]+/g) || [extractedText];
    const simulatedTranscript = chunks.map((chunk, index) => ({
      speaker: index % 2 === 0 ? "Клиент" : "Психолог",
      text: chunk.trim(),
      time: "--:--"
    }));
    setTr(simulatedTranscript);
    setName("Файл: " + fileName.split(".")[0]);
    setView("live");
  }

  async function saveSett(s){setSett(s);settRef.current=s;await fbSaveSett(s);}

  return(<div>
    <Sidebar view={view} setView={setView} isRec={isRec} onSett={()=>setShowSett(true)}/>
    <div className="page">
      {fbLoading&&<div style={{textAlign:"center",padding:"3rem",color:"#94a3b8"} && {display: "block"}}><span className="spin"></span>Синхронизация кабинета...</div>}
      {!fbLoading&& (
        <div>
          {view==="home"&&<HomeView sessions={sessions} onStart={()=>{setTr([]);setNotes([]);setMak(null);setView("live");}} onFile={()=>setView("file")} onSelect={s=>{setSel(s);setView("detail");}} onDel={delS}/>}
          {view==="live"&&<LiveView isRec={isRec} tr={tr} notes={notes} mak={mak} interim={interim} spk={spk} setSpk={setSpk} lN={lN} lM={lM} name={name} setName={setName} auto={auto} setAuto={setAuto} onStart={startRec} onStop={stopRec} onN={()=>doN(false)} onM={doM} onEnd={endSess} trEnd={trEnd} sett={sett}/>}
          {view==="file"&&<FileView onTextReady={handleFileTextReady}/>}
          {view==="detail"&&sel&&<DetailView session={sel} onBack={()=>setView("home")}/>}
        </div>
      )}
    </div>
    {showSett&&<SettingsModal sett={sett} onSave={saveSett} onClose={()=>setShowSett(false)}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
